# Launcher icon for the `stage` Gradle flavor (com.sst.sstcam.stage /
# "SST Cam Stage"). Generated into android/app/src/stage/res by
# `dart run flutter_launcher_icons` (see `just gen-icons`). Paired with
# APP_ENV=stage (real backend + dev tooling on).
#
# Art is the dev icon badged by a distinct adaptive background (orange vs the
# dev/prod yellow) so a stage install is identifiable at a glance without
# authoring separate stage artwork.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "launcher/icon-stage-1024.png"
  adaptive_icon_foreground: "launcher/icon-stage-foreground.png"
  adaptive_icon_background: "#FF8A3C"
  min_sdk_android: 21
