syntax = "proto3";

package sst_cam;

// ---------------------------------------------------------------------------
// Match setup
// ---------------------------------------------------------------------------
message MatchConfigCommand {
  Sport  sport           = 1;
  uint32 period_length_s = 2;
  uint32 num_periods     = 3;
  TeamInfo team_a        = 4;
  TeamInfo team_b        = 5;
  repeated PlayerInfo roster_a = 6;
  repeated PlayerInfo roster_b = 7;
}

message TeamInfo {
  string id   = 1;
  string name = 2;
  string color_hex = 3;  // e.g. "#1A73E8"
}

message PlayerInfo {
  string id     = 1;
  string name   = 2;
  uint32 number = 3;
  string position = 4;
}

enum Sport {
  SPORT_UNKNOWN    = 0;
  SPORT_SOCCER     = 1;
  SPORT_BASKETBALL = 2;
  SPORT_AMERICAN_FOOTBALL = 3;
  SPORT_VOLLEYBALL = 4;
  SPORT_HOCKEY     = 5;
  SPORT_BASEBALL   = 6;
  SPORT_RUGBY      = 7;
  SPORT_OTHER      = 99;
}

// ---------------------------------------------------------------------------
// Match control
// ---------------------------------------------------------------------------
message MatchControlCommand {
  MatchControlAction action = 1;
}

enum MatchControlAction {
  MATCH_ACTION_UNKNOWN = 0;
  MATCH_START          = 1;
  MATCH_STOP           = 2;
  MATCH_PAUSE          = 3;
  MATCH_RESUME         = 4;
  MATCH_NEXT_PERIOD    = 5;
}

message ScoreUpdateCommand {
  string team_id = 1;  // must match TeamInfo.id from MatchConfigCommand
  sint32 delta   = 2;  // +1 goal, -1 disallowed goal, etc.
}

message BannerEventCommand {
  string template_id           = 1;  // e.g. "goal", "foul", "substitution"
  map<string, string> params   = 2;  // {"player_name": "Raul", "number": "10"}
  uint32 duration_s            = 3;  // how long to display the banner
  string player_id             = 4;  // optional; links to PlayerInfo
}

// ---------------------------------------------------------------------------
// Match state — pushed by firmware on the Match State characteristic on every
// state change (start, stop, score, period change, etc.)
// ---------------------------------------------------------------------------
message MatchState {
  MatchStatus status        = 1;
  uint32 current_period     = 2;  // 1-based
  uint32 time_remaining_s   = 3;
  uint32 score_a            = 4;
  uint32 score_b            = 5;
  string team_a_id          = 6;
  string team_b_id          = 7;
  uint64 updated_at         = 8;  // unix millis
}

enum MatchStatus {
  MATCH_STATUS_UNKNOWN  = 0;
  MATCH_NOT_STARTED     = 1;
  MATCH_ACTIVE          = 2;
  MATCH_PAUSED          = 3;
  MATCH_HALF_TIME       = 4;
  MATCH_FINISHED        = 5;
}
