syntax = "proto3";

package sst_cam;

// ---------------------------------------------------------------------------
// SST-Cam Bluetooth (BLE GATT) protocol — single source of truth.
//
// Channel role:
//   * BLE = control plane. Every command/response in this file rides the
//     two GATT characteristics defined in proto/README.md (Command Write +
//     Command Response Notify), wrapped in `ChunkedPayload` for MTU framing.
//   * WiFi Direct = data plane. See wifi.proto for the bulk-data contracts
//     (RTSP H.264 preview, HTTP recording downloads). The BLE side
//     negotiates the WiFi group via StartWifiDirectCommand →
//     WifiDirectGroupResponse (in wifi.proto).
//
// History:
//   This file was consolidated from six smaller files (command, telemetry,
//   match, recording, team, config). During the merge:
//     * Sport was deduplicated to match.proto's superset (UNKNOWN, SOCCER,
//       BASKETBALL, AMERICAN_FOOTBALL, VOLLEYBALL, HOCKEY, BASEBALL, RUGBY,
//       OTHER). team.proto's smaller set was wire-incompatible with this
//       superset — recompile both sides when integrating.
//     * PlayerInfo.position retyped from `string` to the `PlayerPosition`
//       enum. Wire-incompatible; acceptable now because the firmware speaks
//       opaque bytes (proto integration deferred per device-OS team).
//     * DownloadTokenResponse field numbers fixed (auth_token was 2 like
//       http_url in the original — now 3, expires_at bumped to 4).
//
// Versioning policy:
//   * Use `reserved <numbers>` and `reserved "names"` to tombstone removed
//     fields so they are never reused.
//   * Adding optional fields is backward-compatible.
//   * Removing / renaming / renumbering fields requires a coordinated
//     firmware + app release. Bump DeviceInfoResponse.protocol_version.
// ---------------------------------------------------------------------------

// ===========================================================================
// 1. Envelope and framing
// ===========================================================================

// All payloads are wrapped in `ChunkedPayload` to handle proto messages
// larger than the negotiated MTU (typically 512 bytes after MTU exchange).
message ChunkedPayload {
  string correlation_id = 1;
  uint32 chunk_index    = 2;  // 0-based
  uint32 total_chunks   = 3;
  bytes  data           = 4;  // serialised Command or CommandResponse bytes
}

// Sent by the app after receiving each chunk (flow control for large
// payloads such as thumbnails).
message ChunkAck {
  string correlation_id = 1;
  uint32 chunk_index    = 2;
}

// ===========================================================================
// 2. Top-level command / response envelopes
// ===========================================================================

message Command {
  // Unique per-request; echoed in CommandResponse so the app can match
  // replies. App-generated UUID v4 string.
  string correlation_id = 1;

  oneof payload {
    // Device / info
    GetDeviceInfoCommand  get_device_info  = 10;
    ThumbnailRequest      thumbnail        = 11;

    // Polling — app requests these at regular intervals
    GetTelemetryCommand   get_telemetry    = 12;
    GetMatchStateCommand  get_match_state  = 13;

    // Match control
    MatchConfigCommand    match_config     = 20;
    MatchControlCommand   match_control    = 21;
    ScoreUpdateCommand    score_update     = 22;
    BannerEventCommand    banner_event     = 23;

    // Recording / streaming
    RecordingControlCommand  recording_control  = 30;
    StreamingControlCommand  streaming_control  = 31;
    ListRecordingsCommand    list_recordings    = 32;
    DownloadRequestCommand   download_request   = 33;

    // Configuration
    SetWifiConfigCommand      set_wifi_config      = 40;
    SetStreamingConfigCommand set_streaming_config = 41;

    // Admin
    FactoryResetCommand   factory_reset    = 50;
    FirmwareUpdateCommand firmware_update  = 51;

    // Session push (U9) — sent once before recording starts
    PushSessionConfigCommand push_session_config = 52;

    reserved 60, 61, 62, 63, 64, 65, 66, 67, 68, 69, 70;
    reserved "list_teams", "list_team_matches", "create_team", "update_team",
             "delete_team", "set_team_hidden", "add_player", "update_player",
             "remove_player", "add_team_match", "remove_team_match";
    reserved 80, 81, 82, 83;
    reserved "list_sport_presets", "create_sport_preset",
             "update_sport_preset", "delete_sport_preset";
  }
}

message CommandResponse {
  string         correlation_id = 1;
  ResponseStatus status         = 2;
  string         error_message  = 3;  // non-empty only when status != OK

  oneof payload {
    DeviceInfoResponse    device_info     = 10;
    ThumbnailResponse     thumbnail       = 11;
    RecordingListResponse recording_list  = 12;
    DownloadTokenResponse download_token  = 13;
    DeviceTelemetry       telemetry       = 14;  // GetTelemetryCommand reply
    MatchState            match_state     = 15;  // GetMatchStateCommand reply
    reserved 16, 17, 18, 19, 20, 21, 22;
    reserved "team_list", "team_match_list", "team", "player", "team_match",
             "sport_preset_list", "sport_preset";
  }
}

enum ResponseStatus {
  OK          = 0;
  ERROR       = 1;
  TIMEOUT     = 2;
  UNSUPPORTED = 3;
}

// ===========================================================================
// 3. Parameterless commands
// ===========================================================================

message GetDeviceInfoCommand  {}
message GetTelemetryCommand   {}  // app polls ~1 Hz
message GetMatchStateCommand  {}  // app polls ~0.5 Hz
message ListRecordingsCommand {}
message FactoryResetCommand   {}
message FirmwareUpdateCommand {}

// ===========================================================================
// 4. Telemetry / device info
// ===========================================================================

// Returned in CommandResponse.device_info.
message DeviceInfoResponse {
  string device_id        = 1;
  string name             = 2;
  string firmware_version = 3;  // semver, e.g. "0.2.1"
  string model            = 4;  // e.g. "Jetson Orin NX"
  uint32 protocol_version = 5;  // bumped on breaking schema changes
}

// Returned in CommandResponse.telemetry. App polls at ~1 Hz.
message DeviceTelemetry {
  // Storage
  uint64 storage_free_bytes  = 1;
  uint64 storage_total_bytes = 2;

  // Network
  WifiState wifi_state         = 3;
  string    wifi_ssid          = 4;  // empty when disconnected
  sint32    wifi_signal_dbm    = 5;  // 0 when disconnected
  bool      internet_reachable = 6;

  // System health
  float  temp_celsius   = 7;
  float  ram_used_pct   = 8;  // 0.0–1.0
  float  cpu_used_pct   = 9;  // 0.0–1.0
  uint64 uptime_seconds = 10;

  // Recording / streaming snapshot (mirrors MatchState but lighter weight)
  bool is_recording = 11;
  bool is_streaming = 12;
}

enum WifiState {
  WIFI_UNKNOWN      = 0;
  WIFI_DISABLED     = 1;
  WIFI_DISCONNECTED = 2;
  WIFI_CONNECTED    = 3;
}

// Camera preview thumbnail — BLE is too slow for video, so the app pulls
// stills here and uses the WiFi Direct RTSP stream for live preview.
message ThumbnailRequest {
  uint32 width   = 1;  // suggested 160
  uint32 height  = 2;  // suggested 90
  uint32 quality = 3;  // JPEG quality 0–100, suggested 60
}

message ThumbnailResponse {
  // Chunks are reassembled by the app using ChunkedPayload.
  bytes  jpeg_bytes        = 1;
  uint64 capture_timestamp = 2;  // unix millis
}

// ===========================================================================
// 5. Shared enums
// ===========================================================================

// Canonical Sport enum (superset of historical match.proto values).
enum Sport {
  SPORT_UNKNOWN           = 0;
  SPORT_SOCCER            = 1;
  SPORT_BASKETBALL        = 2;
  SPORT_AMERICAN_FOOTBALL = 3;
  SPORT_VOLLEYBALL        = 4;
  SPORT_HOCKEY            = 5;
  SPORT_BASEBALL          = 6;
  SPORT_RUGBY             = 7;
  SPORT_OTHER             = 99;
}

enum PlayerPosition {
  POSITION_UNKNOWN  = 0;
  POSITION_KEEPER   = 1;
  POSITION_DEFENDER = 2;
  POSITION_MID      = 3;
  POSITION_FORWARD  = 4;
  POSITION_OTHER    = 99;
}

// ===========================================================================
// 6. Match
// ===========================================================================

message MatchConfigCommand {
  Sport               sport           = 1;
  uint32              period_length_s = 2;
  uint32              num_periods     = 3;
  TeamInfo            team_a          = 4;
  TeamInfo            team_b          = 5;
  repeated PlayerInfo roster_a        = 6;
  repeated PlayerInfo roster_b        = 7;
}

message TeamInfo {
  string id        = 1;
  string name      = 2;
  string color_hex = 3;  // e.g. "#1A73E8"
}

message PlayerInfo {
  string         id       = 1;
  string         name     = 2;
  uint32         number   = 3;
  PlayerPosition position = 4;
}

message MatchControlCommand {
  MatchControlAction action = 1;
}

enum MatchControlAction {
  MATCH_ACTION_UNKNOWN = 0;
  MATCH_START          = 1;
  MATCH_STOP           = 2;
  MATCH_PAUSE          = 3;
  MATCH_RESUME         = 4;
  MATCH_NEXT_PERIOD    = 5;
}

message ScoreUpdateCommand {
  string team_id = 1;  // must match TeamInfo.id from MatchConfigCommand
  sint32 delta   = 2;  // +1 goal, -1 disallowed goal, etc.
}

message BannerEventCommand {
  string              template_id = 1;  // e.g. "goal", "foul", "substitution"
  map<string, string> params      = 2;  // {"player_name": "Raul", "number": "10"}
  uint32              duration_s  = 3;
  string              player_id   = 4;  // optional; links to PlayerInfo
}

// Returned via GetMatchStateCommand polling.
message MatchState {
  MatchStatus status          = 1;
  uint32      current_period  = 2;  // 1-based
  uint32      time_remaining_s = 3;
  uint32      score_a         = 4;
  uint32      score_b         = 5;
  string      team_a_id       = 6;
  string      team_b_id       = 7;
  uint64      updated_at      = 8;  // unix millis
}

enum MatchStatus {
  MATCH_STATUS_UNKNOWN = 0;
  MATCH_NOT_STARTED    = 1;
  MATCH_ACTIVE         = 2;
  MATCH_PAUSED         = 3;
  MATCH_HALF_TIME      = 4;
  MATCH_FINISHED       = 5;
}

// ===========================================================================
// 7. Recording / streaming
// ===========================================================================

message RecordingControlCommand {
  RecordingAction action = 1;
}

enum RecordingAction {
  RECORDING_ACTION_UNKNOWN = 0;
  RECORDING_START          = 1;
  RECORDING_STOP           = 2;
}

message StreamingControlCommand {
  StreamingAction action      = 1;
  string          destination = 2;  // RTMP URL (pre-built with key by the app)
}

enum StreamingAction {
  STREAMING_ACTION_UNKNOWN = 0;
  STREAMING_START          = 1;
  STREAMING_STOP           = 2;
}

// One entry per recorded file on the Jetson.
message RecordingMetadata {
  string id           = 1;
  uint64 duration_s   = 2;
  uint64 size_bytes   = 3;
  uint64 started_at   = 4;  // unix millis
  string sport        = 5;  // human-readable label
  string teams        = 6;  // e.g. "Team A vs Team B"
  string thumbnail_id = 7;  // optional per-recording thumbnail handle
}

message RecordingListResponse {
  repeated RecordingMetadata recordings = 1;
}

// The Jetson serves video over WiFi Direct (HTTP/1.1 with byte-range support);
// BLE is used only to obtain a short-lived URL + bearer token.
message DownloadRequestCommand {
  string recording_id = 1;
}

message DownloadTokenResponse {
  string recording_id = 1;
  string http_url     = 2;  // e.g. "http://192.168.49.1:8080/recordings/abc.mp4"
  string auth_token   = 3;  // Bearer token; short-lived (~15 min)
  uint64 expires_at   = 4;  // unix millis
}

// ===========================================================================
// 8. Configuration — credentials never logged by the app
// ===========================================================================

// WiFi credentials for the Jetson's outbound (cellular-tethered) network.
// Stored on device; not used for the WiFi Direct group between phone and
// camera (those credentials are returned in WifiDirectGroupResponse).
message SetWifiConfigCommand {
  string ssid     = 1;
  string password = 2;
}

// Streaming destinations — the app collects keys and sends them to the
// Jetson. Keys are NOT stored in the app or in version control; the Jetson
// holds them.
message SetStreamingConfigCommand {
  StreamingConfig config = 1;
}

message StreamingConfig {
  // Provide whichever destinations are configured; leave others empty.
  string youtube_stream_key   = 1;
  string instagram_stream_key = 2;
  string custom_rtmp_url      = 3;  // full RTMP URL including key
}

// ===========================================================================
// 9. Session push (U9)
// ===========================================================================

// Sent by the app once before the session starts. The camera holds this
// in-memory for the duration of the session and forgets it on reset.
// Replaces the previous CRUD-based data sync: the camera receives everything
// it needs to execute the session in a single call.
message PushSessionConfigCommand {
  string match_uuid              = 1;
  string user_uuid               = 2;
  string sport                   = 3;  // lowercase, e.g. "soccer"
  int32  num_periods             = 4;
  int32  period_length_seconds   = 5;
  optional string rtmp_url       = 6;  // null = no streaming
  optional string stream_key     = 7;  // null when embedded in rtmp_url
  string video_output_path       = 8;  // "/data/video/{userUuid}/{matchUuid}/"
  string thumbnail_output_path   = 9;  // "/data/thumbnail/{userUuid}/{matchUuid}/"
}
