syntax = "proto3";

package sst_cam;

// ---------------------------------------------------------------------------
// WiFi credentials for the Jetson (stored on device; never logged by the app)
// ---------------------------------------------------------------------------
message SetWifiConfigCommand {
  string ssid     = 1;
  string password = 2;
}

// ---------------------------------------------------------------------------
// Streaming destinations — the app collects keys and sends them to the Jetson.
// Keys are NOT stored in the app or in version control; the Jetson holds them.
// ---------------------------------------------------------------------------
message SetStreamingConfigCommand {
  StreamingConfig config = 1;
}

message StreamingConfig {
  // Provide whichever destinations are configured; leave others empty.
  string youtube_stream_key  = 1;
  string instagram_stream_key = 2;
  string custom_rtmp_url     = 3;  // full RTMP URL including key
}
