syntax = "proto3";

package sst_cam;

// ---------------------------------------------------------------------------
// SST-Cam WiFi Direct — preview stream descriptor and heartbeat.
//
// The WiFi Direct group handshake (StartWifiDirectCommand, StopWifiDirectCommand,
// WifiDirectGroupResponse) is defined in bluetooth.proto because it travels
// over BLE. This file covers the WiFi-only data-plane descriptors.
//
// Data-plane stack:
//   Live preview: RTSP H.264 (NVENC) via gst-rtsp-server
//                 URL: rtsp://<group_owner_ip>:<preview_port>/preview
//   Downloads:    HTTP/1.1 byte-range requests authenticated with Bearer token
//                 Token obtained via DownloadRequestCommand over BLE
// ---------------------------------------------------------------------------

// Descriptor for the live preview stream. Returned alongside
// WifiDirectGroupResponse or updated mid-session (e.g., bitrate drop).
message PreviewStreamDescriptor {
  string       url          = 1;
  PreviewCodec codec        = 2;
  uint32       width        = 3;
  uint32       height       = 4;
  uint32       fps          = 5;
  uint32       bitrate_kbps = 6;
}

enum PreviewCodec {
  PREVIEW_CODEC_UNKNOWN   = 0;
  PREVIEW_CODEC_RTSP_H264 = 1;

  reserved 2;
  reserved "PREVIEW_MJPEG_HTTP", "PREVIEW_WEBRTC_H264";
}

// App-side heartbeat: fired at the codec's nominal frame rate so other UI
// surfaces can detect "frames flowing" without subscribing to the RTSP byte
// stream. Carries no pixel data.
message PreviewFrame {
  uint64 sequence        = 1;
  uint64 capture_unix_ms = 2;

  reserved 3;
  reserved "jpeg_bytes";
}
