volumes:
  claude:
    name: claude

services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - claude:/root/.claude
      - ~/.local/bin/claude:/root/.local/bin/claude:ro
    network_mode: host
    mem_limit: 16g
    command: sleep infinity
