[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:mediamtx]
command=/usr/local/bin/mediamtx /etc/mediamtx/mediamtx.yml
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ffmpeg]
; 2-second delay lets mediamtx bind its RTSP port before ffmpeg tries to publish.
; supervisord restarts ffmpeg if it exits (e.g. mediamtx not yet ready on first try).
command=/bin/sh -c "sleep 2 && ffmpeg -re -stream_loop -1 -i /srv/sample.mp4 -c copy -f rtsp -rtsp_transport tcp rtsp://localhost:8554/preview"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:download-server]
command=python3 /srv/download_server.py
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
