[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:mediamtx]
command=/usr/local/bin/mediamtx /etc/mediamtx/mediamtx.yml
autostart=true
autorestart=true
startretries=10
; Repeat stdout_logfile=/dev/stdout + redirect_stderr=true in every [program:*] block.
; supervisord on Alpine does not support [program-defaults] for log options.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ffmpeg]
; Waits for mediamtx to bind :8554 before publishing — robust on slow/emulated hosts.
command=/bin/sh -c "until nc -z localhost 8554; do sleep 0.5; done && ffmpeg -re -stream_loop -1 -i /srv/sample.mp4 -c copy -f rtsp -rtsp_transport tcp rtsp://localhost:8554/preview"
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:download-server]
command=python3 /srv/download_server.py
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
