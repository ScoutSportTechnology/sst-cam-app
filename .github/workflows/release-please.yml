name: release-please

# Runs on every push to main. release-please maintains a "release PR" that
# accumulates conventional-commit changes and bumps the app version in
# pubspec.yaml. Merging that PR creates a `v<version>` tag + GitHub Release.
#
# The APK build is CHAINED here (build-and-upload job, gated on
# release-please's `releases_created` output) rather than living in a separate
# `release: published` workflow. This sidesteps the GITHUB_TOKEN recursion
# guard entirely — no second token/App is needed: the build runs in the same
# workflow run that cut the release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          # Default GITHUB_TOKEN. Needs "Allow GitHub Actions to create and
          # approve pull requests" enabled on the repo (set via API at setup).
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-upload:
    name: Build & upload release APKs
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Proto is still consumed via the `proto/` git submodule + `just gen-proto`
          # (the Dart-package cutover is deferred — see pubspec.yaml TODO). The
          # release build therefore needs the submodule checked out.
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # protoc + the Dart plugin are needed for `just gen-proto`. Remove this
      # step once the proto Dart-package cutover lands (pubspec.yaml TODO).
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: flutter pub get

      - name: Install Dart protoc plugin
        run: dart pub global activate protoc_plugin

      - name: Generate proto bindings
        # Mirrors `just gen-proto`. The submodule provides proto/*.proto.
        run: |
          mkdir -p lib/models/proto
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          protoc --dart_out=lib/models/proto -I proto proto/*.proto

      - name: Materialize Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          # Decode the base64-encoded keystore into android/app/ (so the relative
          # storeFile path in key.properties resolves correctly).
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build production APK
        run: flutter build apk --release -t lib/main_prod.dart --dart-define=APP_ENV=prod

      - name: Rename production APK
        run: |
          mkdir -p dist
          cp build/app/outputs/apk/release/app-release.apk \
            "dist/sst-cam-app-${TAG}-production.apk"

      - name: Build developer APK
        run: flutter build apk --release --dart-define=APP_ENV=stage

      - name: Rename developer APK
        run: |
          mkdir -p dist
          cp build/app/outputs/apk/release/app-release.apk \
            "dist/sst-cam-app-${TAG}-developer.apk"

      - name: Upload APKs to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${TAG}" \
            "dist/sst-cam-app-${TAG}-production.apk" \
            "dist/sst-cam-app-${TAG}-developer.apk" \
            --clobber

      # NOTE (open item): the developer + production APKs currently share the
      # applicationId "com.sst.sstcam", so they cannot be installed side-by-side
      # on a single device. If that is required, add `applicationIdSuffix ".dev"`
      # to the developer variant (see the TODO in android/app/build.gradle.kts).
