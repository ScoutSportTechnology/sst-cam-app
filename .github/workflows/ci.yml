  # build-ios:
  #   name: Build iOS (macOS)
  #   runs-on: macos-latest
  #   needs: analyze-and-test
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: subosito/flutter-action@v2
  #       with:
  #         channel: stable
  #     - run: flutter pub get
  #     - run: flutter build ios --release --no-codesign
