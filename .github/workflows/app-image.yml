name: app-image

on:
  push:
    paths:
      - '.devcontainer/Dockerfile'
      - '.devcontainer/devcontainer.json'
      - 'app-image/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/gradle/wrapper/gradle-wrapper.properties'
      - '.github/workflows/app-image.yml'
  workflow_dispatch:

concurrency:
  group: app-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/scoutsporttechnology/sst-cam-app-devcontainer

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < app-image/VERSION)"
          if ! [[ "$version" =~ ^flutter_[0-9]+(\.[0-9]+)*-android_[0-9]+-v[0-9]+$ ]]; then
            echo "::error::Invalid app-image/VERSION: ${version}"
            exit 1
          fi
          recipe="$(git ls-files -s .devcontainer/Dockerfile .devcontainer/devcontainer.json pubspec.yaml pubspec.lock android/gradle/wrapper/gradle-wrapper.properties | sha256sum | cut -d' ' -f1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "recipe=$recipe" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: published
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RECIPE: ${{ steps.ver.outputs.recipe }}
        run: |
          set -euo pipefail
          ref="${IMAGE}:${VERSION}"
          if ! docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          have="$(docker buildx imagetools inspect "$ref" --format '{{ index .Image.Config.Labels "io.sst.app-image.recipe" }}')"
          if [ "$have" != "$RECIPE" ]; then
            echo "::error::${ref} has a different recipe; bump app-image/VERSION"
            exit 1
          fi
          echo 'build=false' >> "$GITHUB_OUTPUT"
      - if: ${{ steps.published.outputs.build == 'true' }}
        uses: docker/setup-buildx-action@v3
      - if: ${{ steps.published.outputs.build == 'true' }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RECIPE: ${{ steps.ver.outputs.recipe }}
        run: |
          docker buildx build . -f .devcontainer/Dockerfile \
            --platform linux/amd64 --provenance=false --sbom=false \
            --label "io.sst.app-image.recipe=${RECIPE}" \
            --tag "${IMAGE}:${VERSION}" --push
