name: release

# Auto-release on merge to main. A conventional-commit scan since the last tag
# decides the bump (feat -> minor, fix/perf -> patch, BREAKING -> major) and
# SKIPS when only docs/chore/ci/test/refactor landed. On a real release it then
# builds + uploads the two signed APKs. workflow_dispatch is a manual override.
#
# Default GITHUB_TOKEN only (contents:write); the "Release Tags" ruleset allows
# creating compliant semver tags, so no PAT/App is needed.
#
# Two APKs from one Gradle flavor, differing only by entrypoint + env:
#   - production: -t lib/main_prod.dart --dart-define=APP_ENV=prod
#   - developer : --dart-define=APP_ENV=stage

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version tag eg v1.2.3 (overrides auto-detect)"
        required: false
        default: ""
      bump:
        description: "Force bump level (overrides auto-detect)"
        type: choice
        options: ["", patch, minor, major]
        default: ""

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.ver.outputs.released }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version (conventional-commit aware)
        id: ver
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v*' --sort=-v:refname | head -1)"; latest="${latest:-v0.0.0}"
          ver="${latest#v}"; MA="${ver%%.*}"; rest="${ver#*.}"; MI="${rest%%.*}"; PA="${rest##*.}"

          if [ -n "${IN_VERSION:-}" ]; then
            echo "$IN_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::invalid version '$IN_VERSION'"; exit 1; }
            echo "tag=$IN_VERSION" >> "$GITHUB_OUTPUT"; echo "released=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          bump="${IN_BUMP:-}"
          if [ -z "$bump" ]; then
            if git rev-parse -q --verify "refs/tags/${latest}" >/dev/null 2>&1; then
              range="${latest}..HEAD"
            else
              range="HEAD"
            fi
            log="$(git log --format='%s%n%b' ${range})"
            if echo "$log" | grep -qiE '^BREAKING[ -]CHANGE' || echo "$log" | grep -qE '^[a-z]+(\(.+\))?!:'; then
              bump=major
            elif echo "$log" | grep -qE '^feat(\(.+\))?:'; then
              bump=minor
            elif echo "$log" | grep -qE '^(fix|perf)(\(.+\))?:'; then
              bump=patch
            fi
          fi

          if [ -z "$bump" ]; then
            echo "No releasable commits since ${latest} — skipping release."
            echo "released=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          case "$bump" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          tag="v${MA}.${MI}.${PA}"
          echo "Releasing ${tag} (bump=${bump}, since ${latest})"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"; echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Create tag + GitHub Release
        if: steps.ver.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.ver.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes

  build-and-upload:
    name: Build & upload release APKs
    needs: tag-release
    if: needs.tag-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Proto is still consumed via the `proto/` git submodule + `just gen-proto`
          # (the Dart-package cutover is deferred — see pubspec.yaml TODO).
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # protoc + the Dart plugin are needed for `just gen-proto`. Remove once the
      # proto Dart-package cutover lands (pubspec.yaml TODO).
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: flutter pub get

      - name: Install Dart protoc plugin
        run: dart pub global activate protoc_plugin 21.1.2

      - name: Generate proto bindings
        run: |
          mkdir -p lib/models/proto
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          protoc --dart_out=lib/models/proto -I proto proto/*.proto

      - name: Materialize Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build production APK
        run: flutter build apk --release -t lib/main_prod.dart --dart-define=APP_ENV=prod

      - name: Rename production APK
        run: |
          mkdir -p dist
          cp build/app/outputs/apk/release/app-release.apk \
            "dist/sst-cam-app-${TAG}-production.apk"

      - name: Build developer APK
        run: flutter build apk --release --dart-define=APP_ENV=stage

      - name: Rename developer APK
        run: |
          mkdir -p dist
          cp build/app/outputs/apk/release/app-release.apk \
            "dist/sst-cam-app-${TAG}-developer.apk"

      - name: Upload APKs to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${TAG}" \
            "dist/sst-cam-app-${TAG}-production.apk" \
            "dist/sst-cam-app-${TAG}-developer.apk" \
            --clobber

      # NOTE (open item): production + developer APKs share applicationId
      # "com.sst.sstcam" so they can't coexist on one device. Add
      # applicationIdSuffix ".dev" to the developer variant if needed
      # (see TODO in android/app/build.gradle.kts).
