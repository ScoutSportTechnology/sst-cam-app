name: release

# Owns `main`: promote, never build.
#
# On push (the release/X.Y.Z -> main merge) the shared promote action finds the
# highest vX.Y.Z-rc.N (the hardware-validated candidate), verifies each APK's
# SHA-256 against the digest recorded in that Release, tags vX.Y.Z on the same
# commit and attaches the same bytes renamed. Stable ships the production APK
# only. It refuses to promote a version that never reached rc.
#
# There is NO flutter / Gradle step here — the structural "main never builds"
# guarantee. After promotion (manual follow-up): delete release/X.Y.Z and open a
# `main -> development` PR.

on:
  push:
    branches: [development, "release/**", main]
  workflow_dispatch:
    inputs:
      to:
        description: "Set to rc to promote the latest beta"
        required: false
        default: ""
      version:
        description: "Alpha base override or X.Y.Z to promote (optional)"
        required: false
        default: ""
      bump:
        description: "Alpha bump override (patch, minor, major)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref_name }}
          TO: ${{ inputs.to }}
          VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          case "$REF:$TO" in
            development:|main:|release/*:|release/*:rc) ;;
            *) exit 1 ;;
          esac
          case "$BUMP" in ''|patch|minor|major) ;; *) exit 1 ;; esac
          if [ "$REF" != development ] && [ -n "$BUMP" ]; then exit 1; fi
          if [[ "$REF" == release/* && "$TO" != rc && -n "$VERSION" ]]; then exit 1; fi

  version:
    needs: validate
    if: github.ref_name != 'main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.to != 'rc'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      released: ${{ steps.ver.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ver
        if: ${{ (github.ref_name == 'development' && hashFiles('.github/workflows/release-alpha.yml') == '') || (github.ref_name != 'development' && hashFiles('.github/workflows/release-beta.yml') == '') }}
        uses: ScoutSportTechnology/.github/actions/resolve-version@v1.1.0
        with:
          mode: ${{ github.ref_name == 'development' && 'alpha' || 'release' }}
          version: ${{ github.ref_name == 'development' && inputs.version || '' }}
          bump: ${{ inputs.bump }}

  publish:
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      prerelease: true
      notes: "${{ github.ref_name == 'development' && '' || 'Prerelease for hardware sign-off: production + developer APK.' }}"
    permissions:
      contents: write
    secrets: inherit

  promote:
    name: Promote existing release (no build)
    needs: validate
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.to == 'rc')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote existing release
        id: promote
        if: ${{ github.ref_name == 'main' || hashFiles('.github/workflows/promote-rc.yml') == '' }}
        uses: ScoutSportTechnology/.github/actions/promote@v1.1.0
        with:
          to: ${{ github.ref_name == 'main' && 'stable' || 'rc' }}
          version: ${{ inputs.version }}
          assets: ${{ github.ref_name == 'main' && '*-production.apk' || '*' }}

      - name: Post-promotion reminder (manual maintainer steps)
        if: github.ref_name == 'main'
        run: |
          {
            echo "## Promoted ${{ steps.promote.outputs.tag }} (from ${{ steps.promote.outputs.source }})"
            echo ""
            echo "- Delete the merged \`release/${{ steps.promote.outputs.base }}\` branch."
            echo "- Open a \`main -> development\` PR so the stable tag's history is in the integration branch."
          } >> "$GITHUB_STEP_SUMMARY"
