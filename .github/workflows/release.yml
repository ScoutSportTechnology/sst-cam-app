name: release

# Owns `main`: promote, never build.
#
# On push (the release/X.Y.Z -> main merge) the shared promote action finds the
# highest vX.Y.Z-rc.N (the hardware-validated candidate), verifies each APK's
# SHA-256 against the digest recorded in that Release, tags vX.Y.Z on the same
# commit and attaches the same bytes renamed. Stable ships the production APK
# only. It refuses to promote a version that never reached rc.
#
# There is NO flutter / Gradle step here — the structural "main never builds"
# guarantee. After promotion (manual follow-up): delete release/X.Y.Z and open a
# `main -> development` PR.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z to promote (overrides detection from the merge commit)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote rc to stable (no build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote the last rc to stable
        id: promote
        uses: ScoutSportTechnology/.github/actions/promote@v1.1.0
        with:
          to: stable
          version: ${{ inputs.version }}
          assets: "*-production.apk"

      - name: Post-promotion reminder (manual maintainer steps)
        run: |
          {
            echo "## Promoted ${{ steps.promote.outputs.tag }} (from ${{ steps.promote.outputs.source }})"
            echo ""
            echo "- Delete the merged \`release/${{ steps.promote.outputs.base }}\` branch."
            echo "- Open a \`main -> development\` PR so the stable tag's history is in the integration branch."
          } >> "$GITHUB_STEP_SUMMARY"
