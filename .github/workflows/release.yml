name: release

# Push to main (a release/X.Y.Z → main merge) → tag vX.Y.Z and publish the
# ALREADY-BUILT beta APKs by copying the assets. There is deliberately NO
# flutter/Gradle build step in this workflow: main only promotes a verified
# artifact, never rebuilds it. This is the structural guarantee for R3/R7/AE4 —
# if you are tempted to add `flutter build` here, you are breaking the contract.
#
# Flow: derive X.Y.Z from the merged release branch → pick the highest existing
# vX.Y.Z-beta.N tag → resolve-version.sh stable X.Y.Z → create the vX.Y.Z Release
# → download the beta assets → rename beta→stable (bytes preserved) → upload.
#
# Default GITHUB_TOKEN only (contents:write); the "Release Tags" ruleset allows
# creating compliant semver tags, so no PAT/App is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version X.Y.Z to promote (overrides branch detect)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote beta APKs to stable (no build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge commit + beta tags are visible.
          fetch-depth: 0

      - name: Derive X.Y.Z + select source beta tag
        id: pick
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The push to main is the release/X.Y.Z → main merge. Derive X.Y.Z
          # robustly: explicit dispatch input first; then the merge commit
          # subject AND body (covers "Merge branch 'release/0.1.0'" and PR
          # merges that carry the branch name only in the body); then fall back
          # to the highest beta tag merged into this commit.
          base=""
          if [ -n "${IN_VERSION:-}" ]; then
            base="${IN_VERSION#v}"
          else
            base="$(git log -1 --format='%s%n%b' "$GITHUB_SHA" \
              | grep -oE 'release/[0-9]+\.[0-9]+\.[0-9]+' | head -1 | sed 's#release/##' || true)"
            if [ -z "$base" ]; then
              cand="$(git tag --merged "$GITHUB_SHA" -l 'v*-beta.*' --sort=-v:refname \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$' | head -1 || true)"
              cand="${cand#v}"; base="${cand%-beta.*}"
            fi
          fi
          echo "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::cannot derive X.Y.Z under promotion (squash merge? pass workflow_dispatch version=vX.Y.Z)"; exit 1; }

          # Highest existing beta tag for this base. Fail fast if none — promotion
          # must never silently rebuild a missing artifact.
          beta="$(git tag -l "v${base}-beta.*" --sort=-v:refname | head -1 || true)"
          [ -n "$beta" ] \
            || { echo "::error::no v${base}-beta.* tag exists to promote — nothing to copy"; exit 1; }

          echo "base=$base"   >> "$GITHUB_OUTPUT"
          echo "beta=$beta"   >> "$GITHUB_OUTPUT"

      - name: Resolve stable tag
        id: ver
        run: ./scripts/ci/resolve-version.sh stable "${{ steps.pick.outputs.base }}"

      - name: Create stable Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # Idempotent: a re-run must not fail on an already-created Release.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes

      - name: Copy beta APKs → stable (verified bytes, renamed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETA: ${{ steps.pick.outputs.beta }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$BETA" --dir dist --pattern '*.apk'

          # Pull the SHA-256 digests recorded in the beta Release notes by
          # release-beta.yml. Promotion copies bytes with NO rebuild, so the
          # only integrity guarantee is this digest match — fail closed if a
          # digest is missing or mismatched.
          notes="$(gh release view "$BETA" --json body --jq '.body')"

          for kind in production developer; do
            src="dist/sst-cam-app-${BETA}-${kind}.apk"
            dst="dist/sst-cam-app-${TAG}-${kind}.apk"
            asset="sst-cam-app-${BETA}-${kind}.apk"
            [ -f "$src" ] \
              || { echo "::error::expected beta asset '${src}' missing from ${BETA} — refusing to rebuild"; exit 1; }

            # Recorded digest for this asset, line format:
            #   sha256: <64hex>  sst-cam-app-<tag>-<kind>.apk
            # Anchor the hex run so an over-length string can't be captured.
            line="$(printf '%s\n' "$notes" | grep -F "$asset" | head -1 || true)"
            recorded="$(printf '%s\n' "$line" \
              | grep -oiE 'sha256:[[:space:]]*[0-9a-f]{64}([^0-9a-f]|$)' \
              | grep -oiE '[0-9a-f]{64}' | head -1 || true)"
            [ -n "$recorded" ] \
              || { echo "::error::no recorded sha256 for '${asset}' in ${BETA} notes — failing closed"; exit 1; }

            actual="$(sha256sum "$src" | cut -d' ' -f1)"
            if [ "$(printf '%s' "$recorded" | tr 'A-F' 'a-f')" != "$actual" ]; then
              echo "::error::sha256 mismatch for '${asset}': recorded=${recorded} actual=${actual}"
              exit 1
            fi
            echo "verified ${asset}: ${actual}"
            mv "$src" "$dst"
          done

          gh release upload "$TAG" \
            "dist/sst-cam-app-${TAG}-production.apk" \
            "dist/sst-cam-app-${TAG}-developer.apk" \
            --clobber

      - name: Run summary — post-promote maintainer actions
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          BETA: ${{ steps.pick.outputs.beta }}
          BASE: ${{ steps.pick.outputs.base }}
        run: |
          {
            echo "### Promoted ${BETA} → ${TAG} (no rebuild)"
            echo ""
            echo "APK bytes copied from the beta prerelease, not rebuilt."
            echo ""
            echo "**Maintainer follow-up:**"
            echo "- Delete the \`release/${BASE}\` branch."
            echo "- Merge \`main\` back to \`develop\` so it never silently diverges."
          } >> "$GITHUB_STEP_SUMMARY"
