name: alpha

# Push to develop → mint the next vX.Y.Z-alpha.N prerelease and publish the
# developer APK. The PR gate (ci.yml) already built this exact tree, so this
# post-merge build should not fail on a non-flake; if it does, the develop code
# has still landed — recover by re-dispatching via workflow_dispatch. This keeps
# the only build-can-fail-after-merge risk on develop, never on main (R3).
#
# Alpha base = conventional-commit bump from the latest *stable* tag; the alpha
# counter increments within that base. Version math lives in
# scripts/ci/resolve-version.sh (single source shared with release-beta/promote).
#
# Default GITHUB_TOKEN only (contents:write); the "Release Tags" ruleset allows
# creating compliant semver tags, so no PAT/App is needed.

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      version:
        description: "Force base version eg v1.2.3 (seeds vX.Y.Z-alpha.1)"
        required: false
        default: ""
      bump:
        description: "Force base bump level (overrides commit scan)"
        type: choice
        options: ["", patch, minor, major]
        default: ""

permissions:
  contents: write

concurrency:
  group: alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpha:
    name: Tag & publish alpha APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for the conventional-commit scan in resolve-version.sh;
          # proto/*.proto comes from the git submodule.
          fetch-depth: 0
          submodules: recursive

      - name: Resolve version (alpha)
        id: ver
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUMP: ${{ inputs.bump }}
        run: ./scripts/ci/resolve-version.sh alpha

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.released == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        if: steps.ver.outputs.released == 'true'
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.ver.outputs.released == 'true'
        run: flutter pub get

      # protoc + the Dart plugin are needed for `just gen-proto`. Pin the plugin
      # to match the app's expected generated API (protobuf ^3.1.0).
      - name: Install protoc
        if: steps.ver.outputs.released == 'true'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dart protoc plugin
        if: steps.ver.outputs.released == 'true'
        run: |
          dart pub global activate protoc_plugin 21.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Generate proto bindings
        if: steps.ver.outputs.released == 'true'
        run: |
          mkdir -p lib/models/proto
          protoc --dart_out=lib/models/proto -I proto proto/*.proto

      - name: Materialize Android signing keystore (if configured)
        if: steps.ver.outputs.released == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          # No keystore secret yet → skip; build.gradle.kts falls back to debug
          # signing so the alpha still produces a (debug-signed) APK.
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — building APK with debug signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      # Alpha publishes the developer APK only (stage env). The production APK is
      # a beta/stable concern.
      - name: Build developer APK
        if: steps.ver.outputs.released == 'true'
        run: flutter build apk --release --dart-define=APP_ENV=stage

      - name: Rename developer APK
        if: steps.ver.outputs.released == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p dist
          cp build/app/outputs/apk/release/app-release.apk \
            "dist/sst-cam-app-${TAG}-developer.apk"

      - name: Create prerelease + upload alpha APK
        if: steps.ver.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            "dist/sst-cam-app-${TAG}-developer.apk"
