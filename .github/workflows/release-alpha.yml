name: release-alpha

# Owns the `development` branch end to end.
#
# On PRs into development → run the CI CHECK jobs (shellcheck + version tests,
# analyze & test, build APK). The build is in the gate — this is what keeps
# `main` from ever needing to build.
#
# On push to development (post-merge) → mint the next vX.Y.Z-alpha.N prerelease and
# publish the developer APK. The PR gate above already built this exact tree, so
# this post-merge build should not fail on a non-flake; if it does, the development
# code has still landed — recover by re-dispatching via workflow_dispatch. This
# keeps the only build-can-fail-after-merge risk on development, never on main (R3).
#
# Alpha base = conventional-commit bump from the latest *stable* tag (release floor
# while a release/X.Y.Z is open); the alpha counter increments within that base.
# Version math lives in the shared resolve-version action (ScoutSportTechnology/.github).
#
# The check jobs are gated to pull_request and the alpha release job to push, so
# the release job is intentionally NOT `needs:`-dependent on the checks (a check
# skipped on push must not block the release).
#
# Default GITHUB_TOKEN only (contents:write); the "Release Tags" ruleset allows
# creating compliant semver tags, so no PAT/App is needed.

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
    # Docs-only pushes must not build/mint an alpha — a Markdown or docs/ change
    # carries no APK delta. (PR-gate checks still run via the pull_request trigger
    # above so required status checks stay satisfiable.)
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      version:
        description: "Force base version eg v1.2.3 (seeds vX.Y.Z-alpha.1)"
        required: false
        default: ""
      bump:
        description: "Force base bump level (overrides commit scan)"
        type: choice
        options: ["", patch, minor, major]
        default: ""

permissions:
  contents: write

concurrency:
  group: alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # changes — detect whether a PR touches build-relevant paths. The expensive
  # PR-gate check (Analyze & Test ~2-3 min) gates on `code`; a docs/markdown-only
  # PR skips it. A job SKIPPED by `if:` counts as SUCCESS for required status
  # checks (only a never-reported/pending check blocks the merge), so the wired
  # `Analyze & Test (Linux)` name stays green on a docs-only PR without running.
  # `CI Scripts` (~13 s) stays always-on. Mirrors sst-cam-firmware's release
  # workflows; the push-side paths-ignore above skips the BUILD on docs commits.
  changes:
    name: changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Filter build-relevant paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              - 'integration_test/**'
              - 'android/**'
              - 'ios/**'
              - 'proto/**'
              - 'scripts/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'flutter_launcher_icons-*.yaml'
              - 'justfile'
              - '.github/workflows/**'

  # ---- CI CHECK jobs (PRs only) -------------------------------------------
  # job name: values below are wired ruleset required-status-check contexts —
  # do NOT rename them or branch protection breaks.

  # Gates the CI scripts (shellcheck), the workflows (actionlint) and the proto/
  # contract pin. Version math lives in the shared actions of
  # ScoutSportTechnology/.github (pinned tag), not in this repo.
  version-script:
    name: CI Scripts (shellcheck + version tests)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint CI scripts (shellcheck)
        run: shellcheck scripts/ci/*.sh

      - name: Lint workflows (actionlint)
        uses: reviewdog/action-actionlint@v1.72.0

      # proto/ must point at a commit merged into the sst-cam-proto branch with
      # the same name as this PR's base (development or release/X.Y.Z).
      - name: proto pin check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./scripts/ci/check-proto-pin.sh "$BASE_REF"

  analyze-and-test:
    name: Analyze & Test (Linux)
    needs: changes
    # Skipped on a docs/markdown-only PR (code == 'false') — a skipped required
    # check counts as success, so the merge is not blocked. Build-relevant PRs run.
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # proto/*.proto comes from the git submodule; the BLE layer imports
          # the generated bindings, so analyze + tests need them generated.
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Format-check hand-written code BEFORE generating protos — generated
      # bindings under lib/models/proto/ are not dart-formatted and must not be
      # format-gated. integration_test/ does not currently exist; include it
      # only if present so the check doesn't hard-error on a missing path.
      - name: Format check
        run: |
          dirs="lib test"
          [ -d integration_test ] && dirs="$dirs integration_test"
          dart format --set-exit-if-changed $dirs

      # The app's BLE layer imports lib/models/proto/*.dart (gitignored,
      # generated). Generate them before analyze/test — mirrors `just gen-proto`.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dart protoc plugin
        run: |
          # Pin to match the app's expected generated API (protobuf ^3.1.0).
          # The latest plugin changes map-field + enum codegen and breaks analyze.
          dart pub global activate protoc_plugin 21.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Generate proto bindings
        run: |
          mkdir -p lib/models/proto
          protoc --dart_out=lib/models/proto -I proto proto/*.proto

      - name: Analyze
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
        continue-on-error: true

  # NOTE: the PR-gate APK build was removed (R1/AE5). analyze-and-test +
  # version-script are the PR gate; the APK is built only on push (the alpha
  # job below). `main` still never builds — the beta artifact is promoted
  # unchanged. The `Build Android APK` ruleset required-check is dropped in
  # lockstep (see docs/ci/rulesets.md) so PRs don't wait on a job that no
  # longer runs.

  # iOS builds require macOS + Xcode — run separately on macOS runners.
  # Uncomment when a macOS CI runner is available (e.g. GitHub Actions macos-latest,
  # Codemagic, or Bitrise).
  #
  # build-ios:
  #   name: Build iOS (macOS)
  #   runs-on: macos-latest
  #   needs: analyze-and-test
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: subosito/flutter-action@v2
  #       with:
  #         channel: stable
  #     - run: flutter pub get
  #     - run: flutter build ios --release --no-codesign

  # ---- alpha release job (push / dispatch only) ---------------------------
  alpha:
    name: Tag & publish alpha APK
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for the conventional-commit scan in the resolver;
          # proto/*.proto comes from the git submodule.
          fetch-depth: 0
          submodules: recursive

      - name: Resolve version (alpha)
        id: ver
        uses: ScoutSportTechnology/.github/actions/resolve-version@v1.1.0
        with:
          mode: alpha
          version: ${{ inputs.version }}
          bump: ${{ inputs.bump }}

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.released == 'true'
        with:
          distribution: temurin
          java-version: 17

      # Caches the Gradle deps + build cache across runs — the largest Android
      # build cost. Pairs with flutter-action's SDK/pub cache below (R9).
      - name: Set up Gradle cache
        if: steps.ver.outputs.released == 'true'
        uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        if: steps.ver.outputs.released == 'true'
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.ver.outputs.released == 'true'
        run: flutter pub get

      # protoc + the Dart plugin are needed for `just gen-proto`. Pin the plugin
      # to match the app's expected generated API (protobuf ^3.1.0).
      - name: Install protoc
        if: steps.ver.outputs.released == 'true'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dart protoc plugin
        if: steps.ver.outputs.released == 'true'
        run: |
          dart pub global activate protoc_plugin 21.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Generate proto bindings
        if: steps.ver.outputs.released == 'true'
        run: |
          mkdir -p lib/models/proto
          protoc --dart_out=lib/models/proto -I proto proto/*.proto

      - name: Materialize Android signing keystore (if configured)
        if: steps.ver.outputs.released == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          # No keystore secret yet → skip; build.gradle.kts falls back to debug
          # signing so the alpha still produces a (debug-signed) APK.
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — building APK with debug signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      # Per-flavor launcher icons (dev/stage/prod) into android/app/src/<flavor>/res
      # from flutter_launcher_icons-{dev,prod}.yaml. Needed before a flavored
      # build so the variant ships its own icon (R8).
      - name: Generate launcher icons
        if: steps.ver.outputs.released == 'true'
        run: dart run flutter_launcher_icons

      # Alpha publishes the developer APK only — the developer VARIANT: real
      # backend + dev tooling (APP_ENV=stage) on the single entry (lib/main.dart),
      # built on the `stage` Gradle flavor (com.sst.sstcam.stage). The production
      # APK is a beta/stable concern.
      # arm64-only — Jetson + device-test phones are all 64-bit ARM; skipping the
      # 32-bit/x86 ABIs cuts build time and APK size. Matches release-beta.yml.
      - name: Build developer APK
        if: steps.ver.outputs.released == 'true'
        run: flutter build apk --release --flavor stage --dart-define=APP_ENV=stage --dart-define=APP_VERSION=${{ steps.ver.outputs.tag }} --dart-define=APP_CHANNEL=alpha --dart-define=PROTO_VERSION=$(git -C proto describe --tags --always 2>/dev/null || echo dev) --target-platform android-arm64

      - name: Rename developer APK
        if: steps.ver.outputs.released == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p dist
          cp build/app/outputs/apk/stage/release/app-stage-release.apk \
            "dist/sst-cam-app-${TAG}-developer.apk"

      # publish-release (ScoutSportTechnology/.github): draft -> upload -> publish,
      # recording `sha256: <hex>  <asset>` for each APK in the notes.
      - name: Publish alpha prerelease (developer APK)
        if: steps.ver.outputs.released == 'true'
        uses: ScoutSportTechnology/.github/actions/publish-release@v1.1.0
        with:
          tag: ${{ steps.ver.outputs.tag }}
          files: dist/sst-cam-app-${{ steps.ver.outputs.tag }}-developer.apk
          prerelease: "true"
