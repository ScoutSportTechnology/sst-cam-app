name: release-beta

# Owns the `release/**` branches end to end.
#
# On PRs into release/** → run the CI CHECK jobs (shellcheck + version tests,
# analyze & test, build APK). The build is in the gate — this is what keeps
# `main` from ever needing to build.
#
# On push to release/X.Y.Z → build BOTH release APKs, mint the next
# vX.Y.Z-beta.N prerelease, and publish the APKs as its assets. The beta base is
# the branch name (authoritative during the stabilization window even if development
# has moved on); the beta counter increments within it. The published beta APK
# asset is exactly what release.yml later copies to the stable Release — main
# never rebuilds (R3/R7).
#
# The check jobs are gated to pull_request and the beta release job to push, so
# the release job is intentionally NOT `needs:`-dependent on the checks (a check
# skipped on push must not block the release).
#
# Default GITHUB_TOKEN only (contents:write); the "Release Tags" ruleset allows
# creating compliant semver tags, so no PAT/App is needed.
#
# Two APKs from one Gradle flavor, differing only by entrypoint + env:
#   - production: -t lib/main_prod.dart --dart-define=APP_ENV=prod
#   - developer : --dart-define=APP_ENV=stage

on:
  pull_request:
    branches: [release/**]
  push:
    branches: [release/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- CI CHECK jobs (PRs only) -------------------------------------------
  # job name: values below are wired ruleset required-status-check contexts —
  # do NOT rename them or branch protection breaks.

  # Gates the shared release version logic. resolve-version.sh drives all three
  # release workflows (alpha/beta/release); it is committed but only ever runs in
  # CI here — keep it covered and shellcheck-clean.
  version-script:
    name: CI Scripts (shellcheck + version tests)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint CI scripts (shellcheck)
        run: shellcheck scripts/ci/*.sh

      - name: Lint workflows (actionlint)
        uses: reviewdog/action-actionlint@v1.72.0

      - name: resolve-version unit tests
        run: ./scripts/ci/resolve-version-test.sh

  analyze-and-test:
    name: Analyze & Test (Linux)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # proto/*.proto comes from the git submodule; the BLE layer imports
          # the generated bindings, so analyze + tests need them generated.
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Format-check hand-written code BEFORE generating protos — generated
      # bindings under lib/models/proto/ are not dart-formatted and must not be
      # format-gated. integration_test/ does not currently exist; include it
      # only if present so the check doesn't hard-error on a missing path.
      - name: Format check
        run: |
          dirs="lib test"
          [ -d integration_test ] && dirs="$dirs integration_test"
          dart format --set-exit-if-changed $dirs

      # The app's BLE layer imports lib/models/proto/*.dart (gitignored,
      # generated). Generate them before analyze/test — mirrors `just gen-proto`.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dart protoc plugin
        run: |
          # Pin to match the app's expected generated API (protobuf ^3.1.0).
          # The latest plugin changes map-field + enum codegen and breaks analyze.
          dart pub global activate protoc_plugin 21.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Generate proto bindings
        run: |
          mkdir -p lib/models/proto
          protoc --dart_out=lib/models/proto -I proto proto/*.proto

      - name: Analyze
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
        continue-on-error: true

  build-android:
    name: Build Android APK
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dart protoc plugin
        run: |
          dart pub global activate protoc_plugin 21.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Generate proto bindings
        run: |
          mkdir -p lib/models/proto
          protoc --dart_out=lib/models/proto -I proto proto/*.proto

      - name: Build debug APK
        run: flutter build apk --debug

  # ---- beta release job (push / dispatch only) ----------------------------
  release-beta:
    name: Build & publish beta APKs
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so resolve-version.sh sees existing beta tags; proto
          # comes from the git submodule.
          fetch-depth: 0
          submodules: recursive

      - name: Resolve version (beta)
        id: ver
        run: |
          set -euo pipefail
          # Base X.Y.Z is the release branch name. Fail fast on a malformed branch.
          base="${GITHUB_REF_NAME#release/}"
          echo "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::branch '${GITHUB_REF_NAME}' is not release/X.Y.Z"; exit 1; }
          ./scripts/ci/resolve-version.sh beta "$base"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dart protoc plugin
        run: |
          dart pub global activate protoc_plugin 21.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Generate proto bindings
        run: |
          mkdir -p lib/models/proto
          protoc --dart_out=lib/models/proto -I proto proto/*.proto

      - name: Materialize Android signing keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          # No keystore secret yet → skip; build.gradle.kts falls back to debug
          # signing so the release still produces (debug-signed) APKs.
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — building APKs with debug signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build production APK
        run: flutter build apk --release -t lib/main_prod.dart --dart-define=APP_ENV=prod

      - name: Rename production APK
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p dist
          cp build/app/outputs/apk/release/app-release.apk \
            "dist/sst-cam-app-${TAG}-production.apk"

      - name: Build developer APK
        run: flutter build apk --release --dart-define=APP_ENV=stage

      - name: Rename developer APK
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p dist
          cp build/app/outputs/apk/release/app-release.apk \
            "dist/sst-cam-app-${TAG}-developer.apk"

      - name: Create prerelease + upload beta APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          prod="dist/sst-cam-app-${TAG}-production.apk"
          dev="dist/sst-cam-app-${TAG}-developer.apk"

          # Record the SHA-256 of each APK in the Release notes. release.yml
          # copies these exact bytes to the stable Release with NO rebuild, so
          # this digest is the integrity hand-off it verifies against (fail
          # closed on mismatch). Line format is contractual:
          #   sha256: <64hex>  sst-cam-app-<tag>-<kind>.apk
          prod_sha="$(sha256sum "$prod" | cut -d' ' -f1)"
          dev_sha="$(sha256sum "$dev" | cut -d' ' -f1)"
          notes="$(mktemp)"
          {
            echo "### APK integrity (SHA-256)"
            echo ""
            echo "Promotion to stable copies these bytes unchanged; release.yml"
            echo "verifies each APK against the digest below before publishing."
            echo ""
            echo "    sha256: ${prod_sha}  sst-cam-app-${TAG}-production.apk"
            echo "    sha256: ${dev_sha}  sst-cam-app-${TAG}-developer.apk"
          } > "$notes"

          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$notes" \
            "$prod" \
            "$dev"

      # NOTE (open item): production + developer APKs share applicationId
      # "com.sst.sstcam" so they can't coexist on one device. Add
      # applicationIdSuffix ".dev" to the developer variant if needed
      # (see TODO in android/app/build.gradle.kts).
