name: release-beta

# Owns the `release/**` branches end to end.
#
# On PRs into release/** → run the CI CHECK jobs (shellcheck + version tests,
# analyze & test, build APK). The build is in the gate — this is what keeps
# `main` from ever needing to build.
#
# On push to release/X.Y.Z → build BOTH release APKs, mint the next
# vX.Y.Z-beta.N prerelease, and publish the APKs as its assets. The beta base is
# the branch name (authoritative during the stabilization window even if development
# has moved on); the beta counter increments within it. The published beta APK
# asset is exactly what release.yml later copies to the stable Release — main
# never rebuilds (R3/R7).
#
# The check jobs are gated to pull_request and the beta release job to push, so
# the release job is intentionally NOT `needs:`-dependent on the checks (a check
# skipped on push must not block the release).
#
# Default GITHUB_TOKEN only (contents:write); the "Release Tags" ruleset allows
# creating compliant semver tags, so no PAT/App is needed.
#
# Two APKs from two Gradle flavors (real backend both), differing by flavor +
# entrypoint + env:
#   - production: --flavor prod -t lib/main_prod.dart --dart-define=APP_ENV=prod
#   - developer : --flavor dev                        --dart-define=APP_ENV=stage

on:
  pull_request:
    branches: [release/**]
  push:
    branches: [release/**]
    # Docs-only pushes must not build/mint a beta — a Markdown or docs/ change
    # carries no APK delta, so rebuilding both APKs would be pure waste. (PR-gate
    # checks still run via the pull_request trigger above so required status
    # checks stay satisfiable.)
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

# A stabilization branch takes many quick fix pushes; without this two near
# simultaneous pushes would both resolve the same -beta.N tag and race on
# `gh release create`. Cancel the older run — the latest commit is the intended
# beta. (Matches release-alpha.yml.)
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # changes — detect whether a PR touches build-relevant paths. The expensive
  # PR-gate check (Analyze & Test ~2-3 min) gates on `code`; a docs/markdown-only
  # PR skips it. A job SKIPPED by `if:` counts as SUCCESS for required status
  # checks (only a never-reported/pending check blocks the merge), so the wired
  # `Analyze & Test (Linux)` name stays green on a docs-only PR without running.
  # `CI Scripts` (~13 s) stays always-on. Mirrors sst-cam-firmware's release
  # workflows; the push-side paths-ignore above skips the BUILD on docs commits.
  changes:
    name: changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Filter build-relevant paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              - 'integration_test/**'
              - 'android/**'
              - 'ios/**'
              - 'proto/**'
              - 'scripts/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'flutter_launcher_icons-*.yaml'
              - 'justfile'
              - '.github/workflows/**'

  # ---- CI CHECK jobs (PRs only) -------------------------------------------
  # job name: values below are wired ruleset required-status-check contexts —
  # do NOT rename them or branch protection breaks.

  # Gates the shared release version logic. resolve-version.sh drives all three
  # release workflows (alpha/beta/release); it is committed but only ever runs in
  # CI here — keep it covered and shellcheck-clean.
  version-script:
    name: CI Scripts (shellcheck + version tests)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint CI scripts (shellcheck)
        run: shellcheck scripts/ci/*.sh

      - name: Lint workflows (actionlint)
        uses: reviewdog/action-actionlint@v1.72.0

      - name: resolve-version unit tests
        run: ./scripts/ci/resolve-version-test.sh

  analyze-and-test:
    name: Analyze & Test (Linux)
    needs: changes
    # Skipped on a docs/markdown-only PR (code == 'false') — a skipped required
    # check counts as success, so the merge is not blocked. Build-relevant PRs run.
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # proto/*.proto comes from the git submodule; the BLE layer imports
          # the generated bindings, so analyze + tests need them generated.
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Format-check hand-written code BEFORE generating protos — generated
      # bindings under lib/models/proto/ are not dart-formatted and must not be
      # format-gated. integration_test/ does not currently exist; include it
      # only if present so the check doesn't hard-error on a missing path.
      - name: Format check
        run: |
          dirs="lib test"
          [ -d integration_test ] && dirs="$dirs integration_test"
          dart format --set-exit-if-changed $dirs

      # The app's BLE layer imports lib/models/proto/*.dart (gitignored,
      # generated). Generate them before analyze/test — mirrors `just gen-proto`.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dart protoc plugin
        run: |
          # Pin to match the app's expected generated API (protobuf ^3.1.0).
          # The latest plugin changes map-field + enum codegen and breaks analyze.
          dart pub global activate protoc_plugin 21.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Generate proto bindings
        run: |
          mkdir -p lib/models/proto
          protoc --dart_out=lib/models/proto -I proto proto/*.proto

      - name: Analyze
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
        continue-on-error: true

  # NOTE: the PR-gate APK build was removed (R1/AE5). analyze-and-test +
  # version-script are the PR gate; both APKs are built only on push, in the
  # parallel matrix below. The `Build Android APK` ruleset required-check is
  # dropped in lockstep (see docs/ci/rulesets.md).

  # ---- beta release (push / dispatch only) --------------------------------
  # Split across three jobs so the two ~6-min flavor builds run on SEPARATE
  # runners in PARALLEL instead of sequentially in one (~halves wall-clock):
  #   version → resolve the -beta.N tag once (shared by both builds + publish)
  #   build   → matrix [prod, dev]: each builds + signs + uploads its APK artifact
  #   publish → download both artifacts, record SHA-256, create/refresh the Release
  # Trade-off: two runners re-do checkout/setup and the APKs cross job boundaries
  # as artifacts — more runner-minutes, but lower wall-clock, which is the goal.
  version:
    name: Resolve beta version
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so resolve-version.sh sees existing beta tags. No
          # submodules needed — version math is pure git tags.
          fetch-depth: 0

      - name: Resolve version (beta)
        id: ver
        run: |
          set -euo pipefail
          # Base X.Y.Z is the release branch name. Fail fast on a malformed branch.
          base="${GITHUB_REF_NAME#release/}"
          echo "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::branch '${GITHUB_REF_NAME}' is not release/X.Y.Z"; exit 1; }
          ./scripts/ci/resolve-version.sh beta "$base"

  build:
    name: Build ${{ matrix.kind }} APK
    if: ${{ github.event_name != 'pull_request' }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      # Build both flavors even if one fails, so both outcomes show in the logs.
      fail-fast: false
      matrix:
        include:
          # prod VARIANT: real backend, tooling compiled OUT — prod flavor
          # (com.sst.sstcam) + APP_ENV=prod. The promotion candidate.
          - flavor: prod
            app_env: prod
            kind: production
          # dev VARIANT: real backend + tooling — dev flavor (com.sst.sstcam.dev)
          # + APP_ENV=stage. What the maintainer device-tests for sign-off.
          - flavor: dev
            app_env: stage
            kind: developer
    steps:
      - uses: actions/checkout@v4
        with:
          # proto comes from the git submodule (the BLE layer imports the bindings).
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches the Gradle deps + build cache across runs — the largest Android
      # build cost. Pairs with flutter-action's SDK/pub cache below (R9).
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dart protoc plugin
        run: |
          dart pub global activate protoc_plugin 21.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Generate proto bindings
        run: |
          mkdir -p lib/models/proto
          protoc --dart_out=lib/models/proto -I proto proto/*.proto

      - name: Materialize Android signing keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          # No keystore secret yet → warn and continue; build.gradle.kts falls
          # back to debug signing so the beta still produces (debug-signed) APKs,
          # which are fine for sideload device-testing during stabilization.
          # Release-signing is enforced at STABLE PROMOTION (see release.yml), not
          # here — gating the build hard would block the lane while no keystore
          # exists. Once ANDROID_KEYSTORE_BASE64 is configured, add a release-signed
          # assertion (apksigner) to the release.yml promote step.
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — building beta APK with debug signing (not distributable; see release.yml promote note)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      # Per-flavor launcher icons before building this variant (R8).
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build ${{ matrix.kind }} APK
        run: flutter build apk --release --flavor ${{ matrix.flavor }} -t lib/main_prod.dart --dart-define=APP_ENV=${{ matrix.app_env }}

      - name: Stage APK artifact
        env:
          TAG: ${{ needs.version.outputs.tag }}
          FLAVOR: ${{ matrix.flavor }}
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          mkdir -p dist
          src="build/app/outputs/apk/${FLAVOR}/release/app-${FLAVOR}-release.apk"
          [ -f "$src" ] \
            || { echo "::error::APK not found at ${src} — check Gradle flavor output path"; exit 1; }
          cp "$src" "dist/sst-cam-app-${TAG}-${KIND}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.kind }}
          path: dist/sst-cam-app-${{ needs.version.outputs.tag }}-${{ matrix.kind }}.apk
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish beta release
    if: ${{ github.event_name != 'pull_request' }}
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble + publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # download-artifact lays each artifact in its own subdir — flatten them.
          find artifacts -name '*.apk' -exec cp {} dist/ \;
          prod="dist/sst-cam-app-${TAG}-production.apk"
          dev="dist/sst-cam-app-${TAG}-developer.apk"
          for f in "$prod" "$dev"; do
            [ -f "$f" ] || { echo "::error::expected artifact '${f}' missing from the build matrix"; exit 1; }
          done

          # Record the SHA-256 of each APK in the Release notes. release.yml
          # copies these exact bytes to the stable Release with NO rebuild, so
          # this digest is the integrity hand-off it verifies against (fail
          # closed on mismatch). Line format is contractual:
          #   sha256: <64hex>  sst-cam-app-<tag>-<kind>.apk
          prod_sha="$(sha256sum "$prod" | cut -d' ' -f1)"
          dev_sha="$(sha256sum "$dev" | cut -d' ' -f1)"
          notes="$(mktemp)"
          {
            echo "### APK integrity (SHA-256)"
            echo ""
            echo "Promotion to stable copies these bytes unchanged; release.yml"
            echo "verifies each APK against the digest below before publishing."
            echo ""
            echo "    sha256: ${prod_sha}  sst-cam-app-${TAG}-production.apk"
            echo "    sha256: ${dev_sha}  sst-cam-app-${TAG}-developer.apk"
          } > "$notes"

          # Idempotent: a re-dispatch after a partial failure must not 422 on an
          # already-created Release. Create if absent, else refresh notes; then
          # upload assets with --clobber so the run always ends with the current
          # APKs on the Release regardless of prior partial state.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --target "$GITHUB_SHA" --notes-file "$notes"
          else
            gh release create "$TAG" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file "$notes"
          fi
          gh release upload "$TAG" "$prod" "$dev" --clobber
