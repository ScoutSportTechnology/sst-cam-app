name: promote-rc

# Hardware sign-off: the newest beta of release/X.Y.Z passed the end-to-end test
# on a real Jetson with the app. Re-tag that beta as vX.Y.Z-rc.1 on the SAME
# commit (no rebuild). From then on, merges to release/X.Y.Z mint rc.N instead
# of beta.N, and `release.yml` on main promotes the last rc to stable.
#
# Run it from the release/X.Y.Z branch (a button today; a hardware-rig job will
# trigger it later via `gh workflow run promote-rc.yml --ref release/X.Y.Z`).
# Keep the three sst-cam repos in step: promote the same X.Y.Z in each.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z (default: the release/X.Y.Z branch it runs on)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote the newest beta to rc.1
        uses: ScoutSportTechnology/.github/actions/promote@v1.1.0
        with:
          to: rc
          version: ${{ inputs.version }}
