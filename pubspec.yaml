name: sst_cam_app
description: "SST Cam — mobile companion app for the SST sports camera on NVIDIA Jetson."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # BLE
  flutter_blue_plus: ^1.35.5
  permission_handler: ^12.0.1

  # State management
  flutter_riverpod: ^2.6.1

  # Wire format (BLE + future WiFi control)
  protobuf: ^3.1.0

  # Video / HTTP
  dio: ^5.7.0
  video_player: ^2.9.2
  # RTSP H.264 preview from the camera (libVLC). Used by LivePreviewView.
  flutter_vlc_player: ^7.4.2
  # Cut-only MP4 trimming (no re-encode). LGPL, FFmpeg 7.1.1. Community-maintained
  # fork of the archived arthenica/ffmpeg-kit (ffmpeg_kit_flutter_min had a broken Maven artifact).
  ffmpeg_kit_flutter_new_full: ^2.0.0

  # Storage
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.27
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utilities
  uuid: ^4.5.1
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.2
  build_runner: ^2.4.13
  # For mocking PathProviderPlatform in widget tests (Fix 2)
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/ble/
    - assets/ble/fixtures/

flutter_app_name:
  name: "SST Cam"
  id: "com.sst.sstcam"
  android: true
  ios: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "launcher/icon-dev-1024.png"
  adaptive_icon_foreground: "launcher/icon-dev-foreground.png"
  adaptive_icon_background: "#E8FF3C"
  min_sdk_android: 21
  remove_alpha_ios: false

flutter_native_splash:
  color: "#0A0A0A"
  image: "launcher/splash-dev.png"
  android_gravity: center
  ios_content_mode: center
  branding: "launcher/branding.png"
  branding_bottom_padding: 100
  android_12:
    color: "#0A0A0A"
    image: "launcher/splash-dev-android12.png"
    icon_background_color: "#0A0A0A"
    branding: "launcher/branding.png"

