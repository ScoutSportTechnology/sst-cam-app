name: sst_cam_app
description: "SST Cam — mobile companion app for the SST sports camera on NVIDIA Jetson."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # BLE
  flutter_blue_plus: ^1.35.5
  permission_handler: ^12.0.1

  # State management
  flutter_riverpod: ^2.6.1

  # Wire format (BLE + future WiFi control)
  protobuf: ^3.1.0
  fixnum: ^1.1.0

  # DEFERRED CUTOVER — proto as a versioned Dart package (plan U2).
  # Today proto is consumed via the `proto/` git submodule + `just gen-proto`
  # (protoc --dart_out=lib/models/proto). The sst-cam-proto repo has NOT cut its
  # first release yet, so this dependency stays COMMENTED OUT to keep the app
  # building. Do NOT uncomment until sst-cam-proto publishes a tag.
  #
  # Cutover steps (do all of these together, then verify):
  #   1. Uncomment the dependency below and set `ref:` to the proto release tag
  #      (e.g. v0.1.0). The Dart package lives at `gen/dart` inside that repo.
  #   2. Remove the `proto/` submodule: `git submodule deinit -f proto`,
  #      `git rm -f proto`, delete the `[submodule "proto"]` block in .gitmodules.
  #   3. Retire `just gen-proto` and drop protoc from the build path
  #      (justfile + .github/workflows/release.yml proto steps).
  #   4. Switch imports from `lib/models/proto/*.dart` to
  #      `package:sst_cam_proto/...` (only BleServiceImpl imports the generated
  #      bindings today — verify with a grep before merging).
  #   5. Remove the `lib/models/proto/` .gitignore entry once it is dead.
  #   6. Verify: `flutter pub get` && `flutter analyze` && `flutter test`.
  #
  # sst_cam_proto:
  #   git:
  #     url: https://github.com/ScoutSportTechnology/sst-cam-proto.git
  #     ref: v0.1.0   # pin to the proto release tag once it exists
  #     path: gen/dart

  # Video / HTTP
  dio: ^5.7.0
  video_player: ^2.9.2
  # RTSP H.264 preview from the camera (libVLC). Used by LivePreviewView.
  # Pinned to 7.4.3: v7.4.4 regenerated Messages.java with pigeon's new package-
  # namespace channel format but did not bump flutter_vlc_player_platform_interface,
  # so Dart and Android talk on different channels → channel-error on every call.
  # v7.4.2 has the correct channel format but still references the removed Flutter
  # v1 embedding API (PluginRegistry.Registrar) → build failure. v7.4.3 is the
  # first version that drops v1 embedding AND keeps the old channel format.
  flutter_vlc_player: 7.4.3
  # Cut-only MP4 trimming (no re-encode). LGPL, FFmpeg 7.1.1. Community-maintained
  # fork of the archived arthenica/ffmpeg-kit (ffmpeg_kit_flutter_min had a broken Maven artifact).
  ffmpeg_kit_flutter_new_full: ^2.0.0

  # Storage
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.27
  shared_preferences: ^2.3.3
  # Pinned via override below: path_provider_android 2.3.x switched from method
  # channels to direct JNI (libdartjni.so), which crashes on Android 16 x86_64
  # with SIGSEGV in FindClass when JNI is not initialised before first use.
  # 2.2.22 is the last pre-JNI release. Remove override once upstream fixes it.
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utilities
  uuid: ^4.5.1
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.2
  build_runner: ^2.4.13
  # For mocking PathProviderPlatform in widget tests (Fix 2)
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  path_provider_android: 2.2.22

flutter:
  uses-material-design: true
  assets:
    - lib/mock/internal/fixtures/
    - lib/mock/emulator/fixtures/
    - lib/mock/emulator/mock-video.mp4
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_app_name:
  name: "SST Cam"
  id: "com.sst.sstcam"
  android: true
  ios: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "launcher/icon-dev-1024.png"
  adaptive_icon_foreground: "launcher/icon-dev-foreground.png"
  adaptive_icon_background: "#E8FF3C"
  min_sdk_android: 21
  remove_alpha_ios: false

flutter_native_splash:
  color: "#0A0A0A"
  image: "launcher/splash-dev.png"
  android_gravity: center
  ios_content_mode: center
  branding: "launcher/branding.png"
  branding_bottom_padding: 100
  android_12:
    color: "#0A0A0A"
    image: "launcher/splash-dev-android12.png"
    icon_background_color: "#0A0A0A"
    branding: "launcher/branding.png"

