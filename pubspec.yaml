name: scout_camera
description: "Mobile companion app for ScoutCamera — AI-powered sports camera on NVIDIA Jetson."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # BLE
  flutter_blue_plus: ^1.35.5
  permission_handler: ^12.0.1

  # State management
  flutter_riverpod: ^2.6.1

  # Wire format (BLE + future WiFi control)
  protobuf: ^3.1.0

  # Video / HTTP
  dio: ^5.7.0
  video_player: ^2.9.2
  # RTSP H.264 preview from the camera (libVLC). Used by LivePreviewView.
  flutter_vlc_player: ^7.4.2

  # Storage
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.27
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utilities
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.2
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

flutter_app_name:
  name: "Scout Camera"
  id: "com.scout.scoutcamera"
  android: true
  ios: true
