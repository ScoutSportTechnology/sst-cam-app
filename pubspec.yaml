name: sst_cam_app
description: "SST Cam — mobile companion app for the SST sports camera on NVIDIA Jetson."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # BLE
  flutter_blue_plus: ^1.35.5
  permission_handler: ^12.0.1

  # State management
  flutter_riverpod: ^2.6.1

  # Wire format (BLE + future WiFi control)
  protobuf: ^3.1.0
  fixnum: ^1.1.0

  # proto is consumed via the `proto/` git submodule + `just gen-proto`
  # (protoc --dart_out=lib/models/proto). proto ships no Dart package — the
  # submodule is the contract. Bump it by checking out a new proto tag in the
  # submodule and committing the gitlink.

  # Video / HTTP
  dio: ^5.7.0
  video_player: ^2.9.2
  # RTSP H.264 preview from the camera (libVLC). Used by LivePreviewView.
  # Pinned to 7.4.3: v7.4.4 regenerated Messages.java with pigeon's new package-
  # namespace channel format but did not bump flutter_vlc_player_platform_interface,
  # so Dart and Android talk on different channels → channel-error on every call.
  # v7.4.2 has the correct channel format but still references the removed Flutter
  # v1 embedding API (PluginRegistry.Registrar) → build failure. v7.4.3 is the
  # first version that drops v1 embedding AND keeps the old channel format.
  flutter_vlc_player: 7.4.3
  # NOTE: clip trimming is done natively (Android MediaExtractor + MediaMuxer via
  # the com.sst.sstcam/media channel — see ClipService). ffmpeg-kit was removed:
  # its prebuilt libavfilter.so failed to dlopen on modern Android
  # (UnsatisfiedLinkError: std::__ndk1::bad_function_call) and crashed the app,
  # and it bloated the APK by ~300 MB for a stream-copy cut the platform does natively.

  # Storage
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.27
  shared_preferences: ^2.3.3
  # Pinned via override below: path_provider_android 2.3.x switched from method
  # channels to direct JNI (libdartjni.so), which crashes on Android 16 x86_64
  # with SIGSEGV in FindClass when JNI is not initialised before first use.
  # 2.2.22 is the last pre-JNI release. Remove override once upstream fixes it.
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utilities
  uuid: ^4.5.1
  flutter_native_splash: ^2.4.3
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.2
  build_runner: ^2.4.13
  # For mocking PathProviderPlatform in widget tests (Fix 2)
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  path_provider_android: 2.2.22

flutter:
  uses-material-design: true
  assets:
    - lib/mock/internal/fixtures/
    - lib/mock/emulator/fixtures/
    - lib/mock/emulator/mock-video.mp4
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_app_name:
  name: "SST Cam"
  id: "com.sst.sstcam"
  android: true
  ios: true

# Launcher icons are configured PER FLAVOR, not here — see
# flutter_launcher_icons-dev.yaml and flutter_launcher_icons-prod.yaml. Run
# `just gen-icons` (dart run flutter_launcher_icons) to generate the per-flavor
# mipmaps into android/app/src/<flavor>/res before building a flavored APK.

flutter_native_splash:
  color: "#0A0A0A"
  image: "launcher/splash-dev.png"
  android_gravity: center
  ios_content_mode: center
  branding: "launcher/branding.png"
  branding_bottom_padding: 100
  android_12:
    color: "#0A0A0A"
    image: "launcher/splash-dev-android12.png"
    icon_background_color: "#0A0A0A"
    branding: "launcher/branding.png"

